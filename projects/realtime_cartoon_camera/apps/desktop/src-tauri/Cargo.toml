[package]
name = "realtime-cartoon-camera"
version = "0.1.0"
description = "Real-time CNN guided cartoon camera"
authors = ["Course Notes"]
edition = "2021"

[lib]
name = "realtime_cartoon_camera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.9.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
