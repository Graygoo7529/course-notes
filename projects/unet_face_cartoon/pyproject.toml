[project]
name = "unet-face-cartoon"
version = "0.1.0"
description = "UNet 人脸语义分割引导的漫画生成：环境与输入契约"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "opencv-python>=4.10,<5",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "face-alignment>=1.4,<2",
    "gdown>=5.2,<6",
]

[dependency-groups]
dev = ["ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unet_face_cartoon"]

# 第一阶段针对当前 Windows x64 工作站锁定，不声称已验证其他平台。
[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ty.src]
include = ["src", "scripts", "tests"]
